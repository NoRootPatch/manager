name: ci

on:
   workflow_dispatch: 
    inputs:
      version:
        description: "Releases version:"
        required: true
        type: string

jobs:
  ci:
    if: ${{ !github.event.deleted }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/reseam/ci:2026.10.19
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}      
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      RESEAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RESEAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RESEAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GMSCORE_KEYSTORE_B64: ${{ secrets.GMSCORE_KEYSTORE_B64 }}
      GMSCORE_KEYSTORE_PASSWORD: ${{ secrets.GMSCORE_KEYSTORE_PASSWORD }}
      GMSCORE_KEY_ALIAS: ${{ secrets.GMSCORE_KEY_ALIAS }}
      GMSCORE_KEY_PASSWORD: ${{ secrets.GMSCORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.bun/install/cache
            ~/.npm
          key: deps-${{ hashFiles('**/Cargo.lock', '**/*.gradle.kts', '**/libs.versions.toml', '**/bun.lock', '**/package-lock.json') }}
          restore-keys: deps-

      - run: just check

      - name: Replace mallopt
        run: |
          for a in $(grep -ral "libreseam-sdk-native.so" ~/.gradle/caches 2>/dev/null); do
                  case "$a" in *.aar|*.jar|*.zip)
                      mkdir -p /tmp/z && (cd /tmp/z && jar xf "$a" && find . -name "*.so" -exec sed -i 's/mallopt\x00/getpid\x00\x00/g' {} + && jar cf "$a" .) && rm -rf /tmp/z
                  ;; esac
              done
              grep -ral "mallopt" . /usr/local/cargo ~/.gradle/caches 2>/dev/null | xargs -r sed -i 's/mallopt\x00/getpid\x00\x00/g; s/\bmallopt\b/getpid/g'
              rm -rf composeApp/build

      - run: just release ${{ inputs.version }}

      - name: Upload Android APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Reseam-Android-APK-${{ inputs.version }}
          path: |
            composeApp/build/release/**/*.apk
            composeApp/build/outputs/apk/**/*.apk
          retention-days: 7
